<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HawkerHub - Order History</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="Menu.css">
</head>
<body class="menu-page">
    <header>
        <nav class="navbar">
            <div class="navbar-left">
                <a href="Menu.html" class="btn-back-menu">
                    <svg xmlns="http://www.w3.org/2000/svg" class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                    </svg>
                    Back
                </a>
                <div class="navbar-center">
                    <a class="logo" href="Index.html">
                        SG Hawker Management
                    </a>
                </div>
            </div>
            
            <ul class="nav-links" id="nav-menu">
                <li>
                    <a href="cart.html" class="btn-cart">
                        <svg xmlns="http://www.w3.org/2000/svg" class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.5 2M7 13h10l3-8H6.5" />
                            <circle cx="9" cy="20" r="1.5" fill="currentColor" />
                            <circle cx="18" cy="20" r="1.5" fill="currentColor" />
                        </svg>
                        Cart <span id="cart-count" class="cart-badge">0</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <div class="page-view menu-page-view">
        <section class="menu-panel">
            <div class="catalog-header">
                <div>
                    <h1 class="catalog-title">Order History</h1>
                    <p class="text-gray-500">Review your past orders, items, and totals.</p>
                </div>
                <a href="Menu.html" class="menu-card-button" style="text-decoration:none; display:inline-flex; align-items:center;">Back to Menu</a>
            </div>

            <div id="history-loading" class="empty-state-box" style="display:block;">
                <h3>Loading your order history...</h3>
                <p>Please wait while we fetch your recent orders from the database.</p>
            </div>

            <div id="history-empty" class="empty-state-box hidden">
                <h3>No orders found</h3>
                <p>You have not placed any orders yet. Once you do, they will appear here.</p>
            </div>

            <div id="history-list" class="menu-grid" style="margin-top:1rem;"></div>
        </section>
    </div>

    <script src="order-history.js"></script>
</body>
</html>
