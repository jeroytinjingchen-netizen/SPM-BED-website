<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HawkerHub - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="navbar-left">
                <div class="navbar-back-spacer" aria-hidden="true"></div>
                <div class="navbar-center">
                    <a class="logo" href="Index.html">SG Hawker Management</a>
                </div>
            </div>

            <ul class="nav-links" id="nav-menu">
                <li><a href="Index.html">Home</a></li>
                <li><a href="Menu.html">Menu</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="member.html">🎁 Member</a></li>
                <li><a href="rewards.html">🏆 Rewards</a></li>
                <li><a href="Index.html">Log Out</a></li>
            </ul>
        </nav>
    </header>

    <main class="dashboard-page">
        <section class="dashboard-banner">
            <h2>
                Welcome Back,
                <span id="user-display-name">User</span>!
            </h2>

            <p style="color: #666; margin-top: 0.5rem;">
                Role Authentication:
                <strong id="user-display-role" style="color:var(--primary-color);">
                    Guest
                </strong>
            </p>

            <hr style="margin: 1.5rem 0; border: 0; border-top: 1px solid #eee;">

            <p>
                Your secure session is active.
            </p>

            <div style="margin-top: 1.5rem;">
                <button type="button" class="btn-primary" onclick="window.location.href='feedback.html'">
                    Create Feedback
                </button>
            </div>

            <hr style="margin: 1.5rem 0; border: 0; border-top: 1px solid #eee;">

            <h3>Update Your Profile</h3>

            <div id="update-alert" class="alert"></div>

            <form id="update-form" onsubmit="handleUpdateProfile(event)">
                <div class="form-group">
                    <label for="update-name">Full Name</label>
                    <input type="text" id="update-name" required placeholder="Enter full name">
                </div>

                <div class="form-group">
                    <label for="update-contact">Contact Number</label>
                    <input type="text" id="update-contact" required placeholder="e.g. 91234567" maxlength="15">
                </div>

                <div class="form-group">
                    <label for="update-email">Email Address</label>
                    <input type="email" id="update-email" required placeholder="name@domain.com">
                </div>

                <button type="submit" id="update-submit-btn">Save Changes</button>
            </form>

            <hr style="margin: 1.5rem 0; border: 0; border-top: 1px solid #eee;">

            <h3 style="color: var(--primary-color);">Danger Zone</h3>

            <p style="color:#666; font-size:0.9rem; margin: 0.5rem 0 1rem;">
                Deleting your account is permanent and cannot be undone. Uses DELETE /api/customers/:id.
            </p>

            <div id="delete-alert" class="alert"></div>

            <button type="button" class="btn-danger" id="delete-account-btn" onclick="handleDeleteAccount()">
                Delete My Account
            </button>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
