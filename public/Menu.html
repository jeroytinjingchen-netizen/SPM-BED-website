<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HawkerHub - Menu Management</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="Menu.css">
</head>

<body class="menu-page">

    <nav class="navbar sticky-navbar">
        <div class="container-sm">
            <div class="navbar-brand">
                <span class="brand-title" onclick="navigateTo('menu-view')">SG Hawker Management</span>
            </div>
        </div>
    </nav>

    <a id="cart-button" href="cart.html" class="menu-action-button cart-button">
        <svg xmlns="http://www.w3.org/2000/svg" class="menu-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.5 2M7 13h10l3-8H6.5" />
            <circle cx="9" cy="20" r="1.5" fill="currentColor" />
            <circle cx="18" cy="20" r="1.5" fill="currentColor" />
        </svg>
        <span class="menu-action-text">Cart</span>
        <span id="cart-count" class="menu-action-count">0</span>
    </a>
    <a href="order-history.html" class="menu-action-button favorite-button">
        <svg xmlns="http://www.w3.org/2000/svg" class="menu-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="menu-action-text">Orders</span>
    </a>

    <div id="menu-view" class="page-view menu-page-view">

        <section class="menu-panel">
            <div class="menu-panel-header">
                <div class="menu-search-wrapper">
                    <label for="search-input" class="sr-only">Search menu items</label>
                    <input type="text" id="search-input" placeholder="Search items by name or description..."
                        class="menu-search-input">
                    <div class="search-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                </div>
                <div class="category-filter-row" id="category-filters">
                    <button onclick="filterCategory('All')" class="category-btn active">All Items</button>
                    <button onclick="filterCategory('Mains')" class="category-btn">Mains</button>
                    <button onclick="filterCategory('Sides')" class="category-btn">Sides</button>
                    <button onclick="filterCategory('Beverages')" class="category-btn">Beverages</button>
                </div>
            </div>
        </section>

        <section>
            <div class="catalog-header">
                <h2 class="catalog-title">Menu Catalog</h2>
                <span id="item-count" class="catalog-count">Showing 0 items</span>
            </div>

            <div id="menu-grid" class="menu-grid"></div>

            <div id="empty-state"
                class="hidden empty-state-box">
                <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-12 w-12 text-gray-400" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <h3 class="mt-4 text-sm font-semibold text-gray-900">No menu items found</h3>
                <p class="mt-1 text-sm text-gray-500">Try adjusting your search query or selected category.</p>
            </div>
        </section>
    </div>

    <div id="details-view" class="page-view hidden max-w-3xl mx-auto px-4 sm:px-6 py-8">
        <button onclick="navigateTo('menu-view')"
            class="mb-6 inline-flex items-center gap-2 text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors group">
            <svg xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4 transform group-hover:-translate-x-0.5 transition-transform" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Back to Menu Catalog
        </button>

        <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
            <div
                class="h-48 bg-linear-to-r from-indigo-500 to-purple-600 flex items-center justify-center text-white p-6 relative">
                <div class="text-center">
                    <span id="detail-page-badge"
                        class="px-2.5 py-1 text-xs font-bold tracking-wide uppercase rounded-full bg-white/20 text-white mb-2 inline-block">Category</span>
                    <h1 id="detail-page-title" class="text-3xl font-extrabold tracking-tight">Item Name</h1>
                </div>
            </div>
            <div class="p-8 space-y-6">
                <div>
                    <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Item Description</h3>
                    <p id="detail-page-description" class="text-gray-600 text-base leading-relaxed">Detailed
                        specification metrics go here.</p>
                </div>
                <div class="grid grid-cols-2 gap-6 border-t border-b border-gray-100 py-6">
                    <div>
                        <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Price Tier</h3>
                        <span id="detail-page-price" class="text-3xl font-black text-indigo-600">$0.00</span>
                    </div>
                    <div>
                        <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Stall Inventory Status
                        </h3>
                        <span id="detail-page-status"
                            class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold mt-1">Available</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="Menu.js"></script>
</body>

</html>
