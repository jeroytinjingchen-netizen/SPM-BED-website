<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feedback</title>

    <link rel="stylesheet" href="feedback.css">
</head>

<body>

    <section id="feedback-section">

        <div class="feedback-header">
            <div class="feedback-icon">💬</div>

            <div>
                <h2>Give Feedback</h2>
                <p>Rate one of our stalls and share your experience.</p>
            </div>
        </div>

        <form id="feedbackForm">

            <div class="feedback-group">
                <label for="stallID">Choose Stall</label>

                <select id="stallID" required>
                    <option value="">-- Select a stall --</option>
                    <option value="STL0000001">Signature Hainanese Chicken Rice</option>
                    <option value="STL0000002">Wok-Fried Hokkien Mee</option>
                    <option value="STL0000003">Crispy Handmade Spring Rolls</option>
                    <option value="STL0000004">Spicy Laksa Lemak</option>
                    <option value="STL0000005">Charcoal Grilled Chicken Satay</option>
                    <option value="STL0000006">Iced Kopi Melaka</option>
                    <option value="STL0000007">Teh Tarik</option>
                </select>
            </div>

            <div class="feedback-group">
                <label for="feedbackRating">Rating</label>

                <select id="feedbackRating" required>
                    <option value="">Choose a rating</option>
                    <option value="1">⭐ 1 — Poor</option>
                    <option value="2">⭐⭐ 2 — Fair</option>
                    <option value="3">⭐⭐⭐ 3 — Good</option>
                    <option value="4">⭐⭐⭐⭐ 4 — Very Good</option>
                    <option value="5">⭐⭐⭐⭐⭐ 5 — Excellent</option>
                </select>
            </div>

            <div class="feedback-group">
                <label for="feedbackComment">Comment</label>

                <textarea id="feedbackComment" maxlength="200" required
                    placeholder="Tell us what you liked or what could be improved..."></textarea>

                <p class="feedback-character-note">
                    Maximum 200 characters.
                </p>
            </div>

            <button id="feedbackSubmitButton" type="submit">
                Submit Feedback
            </button>

            <div id="feedbackMessage"></div>

        </form>

    </section>

    <script src="feedback.js"></script>

</body>

</html>
