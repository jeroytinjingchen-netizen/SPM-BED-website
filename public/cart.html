<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HawkerHub - Cart</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="Menu.css">
</head>

<body class="bg-gray-50 font-sans text-gray-900 min-h-screen">
    <header>
        <nav class="navbar">
            <div class="navbar-left">
                <a href="Menu.html" class="btn-back-menu">
                    <svg xmlns="http://www.w3.org/2000/svg" class="nav-icon" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                    </svg>
                    Back
                </a>
                <div class="navbar-center">
                    <a class="logo" href="Index.html">
                        SG Hawker Management
                    </a>
                </div>
            </div>

            <ul class="nav-links" id="nav-menu">
                <li>
                    <a href="order-history.html" class="btn-orders">
                        <svg xmlns="http://www.w3.org/2000/svg" class="nav-icon" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        History
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="page-view menu-page-view">
        <div style="display: grid; grid-template-columns: 1fr 320px; gap: 1.5rem;">
            <section class="menu-panel">
                <div class="catalog-header">
                    <div>
                        <h1 class="catalog-title">Your Cart</h1>
                        <p id="cart-summary" style="color: #6b7280; font-size: 0.95rem; margin-top: 0.5rem;">0 items
                            selected</p>
                    </div>
                    <button id="clear-cart" type="button"
                        style="background: none; border: none; color: var(--primary-color); font-weight: 600; cursor: pointer; font-size: 0.95rem; text-decoration: underline;">Clear
                        cart</button>
                </div>

                <div id="cart-items" style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
                </div>

                <div id="empty-cart" class="hidden" style="padding: 4rem 1rem; text-align: center;">
                    <svg xmlns="http://www.w3.org/2000/svg"
                        style="margin: 0 auto; height: 3rem; width: 3rem; color: #d1d5db;" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 3h2l.5 2M7 13h10l3-8H6.5" />
                        <circle cx="9" cy="20" r="1.5" fill="currentColor" />
                        <circle cx="18" cy="20" r="1.5" fill="currentColor" />
                    </svg>
                    <h2 style="margin-top: 1rem; font-size: 1.1rem; font-weight: 600; color: #111827;">Your cart is
                        empty</h2>
                    <p style="margin-top: 0.25rem; font-size: 0.9rem; color: #6b7280;">Add dishes from the menu to see
                        them here.</p>
                    <a href="Menu.html" class="btn-back-menu"
                        style="margin-top: 1.5rem; display: inline-flex; align-items: center; justify-content: center;">Back
                        to Menu</a>
                </div>
            </section>

            <aside class="menu-panel" style="height: fit-content;">
                <h2 style="font-size: 1.1rem; font-weight: 600; color: #111827;">Order Summary</h2>
                <div
                    style="margin-top: 1rem; display: flex; flex-direction: column; gap: 0.75rem; font-size: 0.9rem; color: #4b5563;">
                    <div style="display: flex; justify-content: space-between;">
                        <span>Items</span>
                        <span id="summary-count">0</span>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span>Subtotal</span>
                        <span id="summary-subtotal">$0.00</span>
                    </div>
                </div>
                <div
                    style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; align-items: center;">
                    <a href="Menu.html" class="btn-back-menu"
                        style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center; width: 100%;">Back
                        to Menu</a>
                    <button id="checkout-button" type="button" class="menu-card-button hidden"
                        style="width: 100%; display: inline-flex; align-items: center; justify-content: center;">Checkout</button>
                </div>
            </aside>
        </div>
    </main>

    <script src="Menu.js"></script>
</body>

</html>
