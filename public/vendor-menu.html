<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HawkerHub - Vendor Dashboard</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="Menu.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900 min-h-screen menu-page">

    <nav class="navbar sticky-navbar">
        <div class="container-sm">
            <div class="navbar-brand flex items-center justify-between w-full">
                <div class="flex items-center gap-3">
                    <span class="brand-title">SG Hawker Management</span>
                    <!-- Identity Tag -->
                    <span id="vendor-stall-name" class="brand-tag ml-2 bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full text-xs font-bold transition-all">Vendor Portal</span>
                </div>
                <div class="flex items-center gap-4">
                    <a href="#vendor-profile-section" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors">My Profile</a>
                    <a onclick="handleVendorLogout()" class="text-sm font-medium text-indigo-600 hover:text-indigo-800 transition-colors cursor-pointer">Log Out</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- Loading / auth-guard placeholder shown until vendor-menu.js confirms a valid session -->
        <div id="vendor-auth-checking" class="text-center py-16 text-gray-500">
            Checking your session...
        </div>

        <div id="vendor-dashboard-content" class="hidden space-y-8">

        <!-- SECTION: Add New Menu Item -->
        <section class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6">
            <h2 class="text-xl font-bold text-gray-900 mb-4">Add New Menu Item</h2>
            
            <form id="add-item-form" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Item Code</label>
                    <input type="text" id="add-code" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition" placeholder="e.g. ITM005">
                </div>
                <div class="lg:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description (Name)</label>
                    <input type="text" id="add-desc" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition" placeholder="Enter dish name or details">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Price ($)</label>
                    <input type="number" id="add-price" step="0.01" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition" placeholder="0.00">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Category (Cuisine)</label>
                    <select id="add-category" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition">
                        <option value="Mains">Mains</option>
                        <option value="Sides">Sides</option>
                        <option value="Beverages">Beverages</option>
                    </select>
                </div>
                
                <div class="flex items-center lg:mt-6">
                    <input type="checkbox" id="add-special" class="w-4 h-4 text-indigo-600 border-gray-300 rounded">
                    <label for="add-special" class="ml-2 text-sm font-bold text-gray-700">⭐ Daily Special</label>
                </div>

                <div class="lg:col-span-5 flex justify-end mt-2">
                    <button type="submit" class="bg-indigo-600 text-white px-6 py-2.5 rounded-lg font-bold hover:bg-indigo-700 transition-colors">Submit New Item</button>
                </div>
            </form>
        </section>

        <!-- SECTION: Digital Menu Display -->
        <section>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-900">Manage Digital Menu</h2>
            </div>
            <div id="vendor-menu-grid" class="menu-grid"></div>
        </section>

        <!-- SECTION: Vendor Profile (parity with customer dashboard.html) -->
        <section id="vendor-profile-section" class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6">
            <h2 class="text-xl font-bold text-gray-900 mb-4">My Vendor Profile</h2>

            <div id="vendor-update-alert" class="alert"></div>

            <form id="vendor-update-form" class="space-y-4 max-w-lg">
                <div class="form-group">
                    <label for="vendor-update-name">Full Name</label>
                    <input type="text" id="vendor-update-name" required placeholder="Enter full name">
                </div>

                <div class="form-group">
                    <label for="vendor-update-contact">Contact Number</label>
                    <input type="text" id="vendor-update-contact" required placeholder="e.g. 9123456789" maxlength="10">
                </div>

                <div class="form-group">
                    <label for="vendor-update-email">Email Address</label>
                    <input type="email" id="vendor-update-email" required placeholder="name@domain.com">
                </div>

                <button type="submit" id="vendor-update-submit-btn">Save Changes</button>
            </form>

            <hr style="margin: 1.5rem 0; border: 0; border-top: 1px solid #eee;">

            <h3 style="color: var(--primary-color);">Danger Zone</h3>

            <p style="color:#666; font-size:0.9rem; margin: 0.5rem 0 1rem;">
                Deleting your vendor account is permanent and cannot be undone.
            </p>

            <div id="vendor-delete-alert" class="alert"></div>

            <button type="button" class="btn-danger" id="vendor-delete-account-btn" onclick="handleVendorDeleteAccount()">
                Delete My Vendor Account
            </button>
        </section>

        </div><!-- /#vendor-dashboard-content -->

    </main>

    <!-- HIDDEN MODAL: Edit Menu Item -->
    <div id="edit-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl">
            <h2 class="text-xl font-bold text-gray-900 mb-4">Edit Menu Item</h2>
            
            <form id="edit-item-form" class="space-y-4">
                <input type="hidden" id="edit-code">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description (Name)</label>
                    <input type="text" id="edit-desc" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Price ($)</label>
                    <input type="number" id="edit-price" step="0.01" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Category (Cuisine)</label>
                    <select id="edit-category" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none">
                        <option value="Mains">Mains</option>
                        <option value="Sides">Sides</option>
                        <option value="Beverages">Beverages</option>
                    </select>
                </div>
                
                <div class="flex items-center mt-2">
                    <input type="checkbox" id="edit-special" class="w-4 h-4 text-indigo-600 border-gray-300 rounded">
                    <label for="edit-special" class="ml-2 text-sm font-bold text-gray-700">⭐ Daily Special</label>
                </div>
                
                <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-gray-100">
                    <button type="button" onclick="closeEditModal()" class="px-5 py-2 text-sm font-semibold text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors">Cancel</button>
                    <button type="submit" class="px-5 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 transition-colors">Save Updates</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-3"></div>

    <!-- vendor-auth.js first: provides restoreVendorSession(), handleVendorLogout(),
         currentVendor / vendorToken globals that vendor.js relies on -->
    <script src="vendor-auth.js"></script>
    <script src="vendor.js"></script>
</body>
</html>
